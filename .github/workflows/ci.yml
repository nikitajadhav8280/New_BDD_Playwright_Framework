
name: BDDPlaywright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare QA environment
        run: cp config/.env.example config/.env.qa

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber BDD tests
        run: npm run test:bdd:html
        env:
          TEST_ENV: qa

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bdd-test-results
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14
